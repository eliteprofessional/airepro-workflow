# Airepro Workflow (WA-AKG) — production deploy compose (Jenkins + Cloudflare Tunnel).
#
# Jenkins (same host as Cloudflare Tunnel):
#   WORKFLOW_IMAGE_TAG=$BUILD_NUMBER \
#   WORKFLOW_ENV_FILE=/var/www/workflow-backends/workflow/.env \
#   WORKFLOW_UPLOADS_DIR=/var/lib/workflow/uploads \
#   docker compose up -d --no-build --force-recreate
#
# NOTE: image tag var is WORKFLOW_IMAGE_TAG, not BUILD_TAG —
# Jenkins defines BUILD_TAG itself and compose would silently override the tag.
#
# Local all-in-one (MySQL + app): docker compose -f docker-compose.local.yml up -d

services:
  app:
    image: workflow-app:${WORKFLOW_IMAGE_TAG:-latest}
    container_name: workflow-app
    restart: unless-stopped
    environment:
      PORT: "1730"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    ports:
      - "127.0.0.1:1730:1730"
    volumes:
      - ${WORKFLOW_ENV_FILE:-./.env}:/app/.env:ro
      - ${WORKFLOW_UPLOADS_DIR:-workflow_uploads}:/app/uploads
      - workflow_data:/app/data

volumes:
  workflow_uploads:
  workflow_data:
